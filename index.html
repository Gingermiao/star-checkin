<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Yuni打卡</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yuni打卡">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFF5EC">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<style>
/* Layout: iBetter-like. Title bar, one tab at a time (今天 / 项目 / 小兔子 / 总结), fixed tab bar at the bottom.
   今天 = month calendar + big coloured task cards; 项目 = rewards + one stats card per task. */
:root{
  --bg:#F2F0EC; --card:#FFFFFF; --cell:#F5F4F1; --ink:#1F2433; --muted:#6B7080; --faint:#B9BBC2; --line:#E4E2DD;
  --blue:#2F7BE0; --gold:#E8A325; --gold-soft:#FDF1D8; --night:#27306B; --ok:#2F9A6A; --ok-soft:#E1F3EA; --warn:#C8483B; --warn-soft:#FBE4E1;
  --shade:rgba(20,24,41,.45); --meadow:#DDF0D8; --doodle:#E3E0DA;
  --f:ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background-color:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
.doodles{position:fixed;inset:0;z-index:-1;pointer-events:none;color:var(--doodle)}
.wrap{max-width:860px;margin:0 auto;padding-block:12px calc(110px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.topbar{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px}
.round{min-width:48px;height:48px;border-radius:999px;background:var(--card);box-shadow:0 2px 0 var(--line);display:grid;place-items:center;font-size:20px;padding:0 12px}
.round.on{background:var(--gold-soft);box-shadow:0 0 0 2px var(--gold)}
.ttl{text-align:center;font-size:24px;font-weight:800;color:var(--blue);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl span{color:var(--faint);font-weight:400;margin:0 10px}
.ttl em{font-style:normal;color:var(--night)}

.tabpage{display:flex;flex-direction:column;gap:14px}
.box{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 2px 0 var(--line)}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.cal-h b{font-size:18px;flex:1;text-align:center}
.cal-h button{width:40px;height:40px;border-radius:12px;font-size:22px;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dn{text-align:center;font-size:15px;color:var(--muted);padding:4px 0}
.cal-dn.today{color:var(--blue);font-weight:700}
.cell{position:relative;aspect-ratio:1/1;max-height:96px;background:var(--cell);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;border:3px solid transparent}
.cell.out{opacity:.35}
.cell.future{color:var(--faint)}
.cell.today{border-color:var(--blue);color:var(--blue)}
.cell.sel:not(.today){border-color:var(--ink);box-shadow:0 0 0 2px var(--card) inset}
.cell.full{background:var(--gold);color:#fff}
.cell.full::after{content:"★";position:absolute;top:2px;right:6px;font-size:14px;color:#fff}
.cell .dots{display:flex;gap:3px;margin-top:2px;height:8px}
.cell .dots i{width:7px;height:7px;border-radius:50%}
.cell .mo{font-size:11px;font-weight:700;line-height:1}
.cal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.cal-foot button{background:var(--cell);border-radius:12px;padding:6px 14px;font-size:14px;color:var(--blue);font-weight:700}

.rules{background:var(--night);color:#fff;border-radius:18px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center}
.rules h2{font-size:13px;margin:0;opacity:.8;letter-spacing:.06em;width:100%}
.rules div{font-size:16px;font-weight:600;opacity:.85}
.rules .rb{font-size:16px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);border-radius:10px;padding:4px 10px}
.rules .rb small{opacity:.7}
.rules .rb.add{background:transparent;border:1.5px dashed rgba(255,255,255,.5);font-weight:600}
.banner{background:var(--gold-soft);border:2px solid var(--gold);border-radius:16px;padding:10px 14px;font-weight:700;font-size:17px}
.hintline{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px;color:var(--muted)}
.hintline b{color:var(--ink);font-size:19px}
.hintline .sp{flex:1}
.linkb{color:var(--blue);font-weight:700;font-size:15px;padding:4px}
.past{background:var(--cell);border-radius:14px;padding:10px 14px;font-size:15px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* big coloured task cards */
.tcards{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.tc{--c:#5B73E8;position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;background:var(--c);color:#fff;border-radius:18px;padding:16px 18px;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.14);min-height:96px;text-align:left;width:100%}
.tc .ic{width:58px;height:58px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:34px}
.tc .tx{min-width:0}
.tc .nm{font-size:24px;font-weight:800;line-height:1.2}
.tc .ht{font-size:15px;opacity:.92;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc .tg{display:inline-block;margin-top:5px;background:rgba(0,0,0,.18);border-radius:8px;padding:1px 9px;font-size:13px;font-weight:700}
.tc .box2{width:50px;height:50px;border-radius:12px;background:#fff;color:var(--c);display:grid;place-items:center;font-size:32px;font-weight:900;flex:none}
.tc.done .box2{background:#fff}
.tc.done{opacity:.86}
.tc.done .nm{text-decoration:line-through;text-decoration-thickness:3px}
.tc.rest{filter:grayscale(.7);opacity:.7}
.tc .num{position:absolute;top:-10px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:900;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 0 rgba(0,0,0,.2)}
.tc.next{outline:4px solid var(--gold);outline-offset:3px}
.tc .nextlbl{font-size:12px;font-weight:800;background:#fff;color:var(--c);border-radius:6px;padding:0 6px;margin-right:6px;vertical-align:3px}
.tc.pick .box2{background:rgba(255,255,255,.3);color:#fff;font-size:22px}
.tc.picked{outline:4px solid var(--ink);outline-offset:3px}
.under{display:flex;justify-content:flex-end;gap:14px;margin-top:-6px;padding-right:6px}
.zlink{font-size:16px;font-weight:800;color:var(--c);background:var(--card);border:2.5px solid var(--c);border-radius:999px;padding:7px 16px;text-decoration:none;margin-top:4px}
.under button{font-size:13px;color:var(--muted);padding:2px 4px}
.under .undo{color:var(--warn)}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mi{--c:#5B73E8;position:relative;min-height:128px;border-radius:18px;background:var(--card);border:3px solid color-mix(in srgb,var(--c) 45%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:12px 8px;text-align:center;box-shadow:0 2px 0 var(--line)}
.mi .e{font-size:40px;line-height:1.1}
.mi .n{font-size:18px;font-weight:800;color:var(--ink)}
.mi .tm{font-size:12px;font-weight:700;border-radius:8px;padding:1px 8px;background:rgba(0,0,0,.18);color:#fff}
.mi.on{background:var(--c);border-color:var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.14)}
.mi.on .n{color:#fff}
.mi .no{position:absolute;top:-10px;left:-8px;width:34px;height:34px;border-radius:50%;background:var(--ink);color:var(--bg);font-weight:900;display:grid;place-items:center;font-size:17px}
.mi.add{border:3px dashed var(--line);color:var(--muted);box-shadow:none;background:transparent}
.mi.add .e{font-size:34px;color:var(--muted)}.mi.add .n{color:var(--muted)}
@media (max-width:600px){.menu{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.mi{min-height:106px}.mi .e{font-size:32px}.mi .n{font-size:15px}}
.btn{border-radius:14px;padding:12px 20px;font-weight:700;background:var(--card);border:1.5px solid var(--line)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.pickbar{display:flex;gap:10px;flex-wrap:wrap}
.allgood{background:var(--card);border-radius:20px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;box-shadow:0 2px 0 var(--line)}
.allgood b{font-size:24px}
.moods{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.moods button{font-size:38px;border-radius:16px;padding:6px 10px;border:3px solid transparent;background:var(--cell)}
.moods button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft)}
.moods button:disabled{cursor:default}
.empty{color:var(--muted);text-align:center;padding:24px}
.foot{text-align:center;color:var(--faint);font-size:14px;display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.foot b{background:var(--line);color:var(--card);border-radius:999px;padding:2px 12px;font-size:16px}

/* projects */
.rw-h{display:flex;align-items:center;gap:8px;font-size:17px;color:var(--muted);font-weight:700}
.rw-h .sp{flex:1}
.rws{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:10px}
.rw{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rw .t{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px}
.rw .t .e{font-size:24px}
.rw .r{font-size:13px;color:var(--muted)}
.rw .bar{height:10px;border-radius:6px;background:var(--cell);overflow:hidden}
.rw .bar i{display:block;height:100%;background:var(--gold);border-radius:6px}
.rw .go{align-self:flex-start;background:var(--gold);color:#1C1406;border-radius:10px;padding:6px 14px;font-weight:800}
.rw.got{background:var(--gold-soft);border-color:var(--gold)}
.rw.add{border-style:dashed;color:var(--muted);justify-content:center;align-items:center;min-height:90px;font-weight:700}
.redeemed{font-size:14px;color:var(--muted);margin-top:8px}
.pj{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.pj .hd{--c:#5B73E8;background:var(--c);color:#fff;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 18px}
.pj .hd .ic{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:32px}
.pj .hd .nm{font-size:24px;font-weight:800;line-height:1.2}
.pj .hd .ht{font-size:14px;opacity:.85}
.pj .hd .big{text-align:center;line-height:1}
.pj .hd .big b{font-size:40px;font-weight:900;display:block}
.pj .hd .big small{font-size:14px;font-weight:700}
.pj .st{display:grid;grid-template-columns:repeat(3,1fr);padding:12px 18px;gap:8px;border-bottom:1px solid var(--line)}
.pj .st div{display:flex;flex-direction:column}
.pj .st div:nth-child(2){align-items:center}.pj .st div:nth-child(3){align-items:flex-end}
.pj .st span{font-size:14px;color:var(--muted)}
.pj .st b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.pj .st b small{font-size:12px;background:var(--cell);color:var(--faint);border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:4px}
.pj .ft{padding:10px 18px;display:flex;align-items:center;gap:12px;font-size:15px}
.pj .ft .since{color:var(--faint);font-size:13px}
.pj .strip{display:flex;gap:3px;margin-left:auto}
.pj .strip i{width:14px;height:14px;border-radius:4px;background:var(--cell)}
.pj .strip i.y{background:var(--c)}
.pj .strip i.r{background:var(--gold)}

/* pet */
.pet{background:var(--card);border-radius:24px;padding:30px 20px 20px;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 2px 0 var(--line);text-align:center}
.pet .stage{position:relative;width:280px;height:280px;background:radial-gradient(circle at 50% 78%,var(--meadow) 0 46%,transparent 47%);border-radius:20px;cursor:pointer}
#petArt{position:absolute;inset:0}
.petshadow{position:absolute;left:50%;bottom:6px;width:170px;height:18px;margin-left:-85px;border-radius:50%;background:rgba(0,0,0,.13)}
.petscale{position:absolute;left:0;right:0;bottom:8px;height:272px;transform-origin:50% 100%}
#bun{position:absolute;inset:0;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
#bun.hop{animation:hop .7s ease-out}
#bun img,#bun svg{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;object-position:50% 100%}
#bun .fig{position:absolute;bottom:0;left:50%;height:100%;transform:translateX(-50%)}
#bun img.wear{inset:auto;height:auto;filter:drop-shadow(0 1px 1px rgba(74,58,92,.2))}
.wardrobe img{width:30px;height:30px;object-fit:contain;vertical-align:middle;margin-right:4px}
.pet .bubble{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;z-index:2;background:var(--bg);border:2px solid var(--line);border-radius:14px;padding:4px 12px;font-size:15px;font-weight:700;transition:opacity .3s}
.pet .info{width:100%;max-width:560px;display:flex;flex-direction:column;gap:10px;align-items:center}
.pet .pname{font-size:28px;font-weight:800;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;justify-content:center}
.pet .pname small{font-size:15px;font-weight:600;color:var(--muted)}
.pet .rename{font-size:13px;color:var(--blue);font-weight:600}
.pet .pbar{width:100%;height:16px;border-radius:8px;background:var(--cell);overflow:hidden}
.pet .pbar i{display:block;height:100%;background:var(--gold);border-radius:8px;transition:width .8s}
.pet .pnext{font-size:16px;color:var(--muted)}
.pet .pnext b{color:var(--ink)}
.wardrobe{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.wardrobe button{border-radius:999px;padding:6px 14px;font-size:15px;background:var(--cell);border:2px solid var(--line)}
.wardrobe button[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);font-weight:700}
.wardrobe .buy{border-color:var(--blue);color:var(--blue);font-weight:700;animation:wfloat 2.4s ease-in-out infinite}
@keyframes wfloat{50%{transform:translateY(-3px)}}
.pet .pnext small{display:block;font-size:13px;color:var(--muted)}
.wardrobe .lock{border-style:dashed;color:var(--muted);cursor:default}
.namebox{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.namebox input{font:inherit;font-size:18px;border:2px solid var(--gold);border-radius:12px;padding:8px 12px;background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:280px}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
@keyframes hop{0%{transform:translateY(0)}30%{transform:translateY(-30px) scaleY(1.05)}60%{transform:translateY(0) scaleY(.95)}80%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.petpop{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:flex-end;gap:4px;transform:translateY(160%);transition:transform .35s cubic-bezier(.3,1.4,.5,1);cursor:pointer}
.petpop.show{transform:translateY(0)}
.petpop img{width:92px;height:92px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.petpop .pb{background:var(--card);border:2px solid var(--line);border-radius:16px 16px 4px 16px;padding:8px 12px;font-weight:800;font-size:16px;max-width:260px;margin-bottom:56px;box-shadow:0 2px 0 var(--line)}
.pet .bubble{max-width:320px;white-space:normal!important}
.heart{position:absolute;font-size:28px;pointer-events:none;animation:up 1.2s ease-out forwards}
@keyframes up{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px);opacity:0}}

/* summary (reused) */
.sumtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.seg{margin:0 auto;display:flex;background:var(--card);border-radius:12px;padding:4px;border:1.5px solid var(--line)}
.seg button{padding:8px 22px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}
.nav{display:flex;align-items:center;gap:12px}
.nav h2{margin:0;font-size:21px;flex:1;text-align:center}
.navb{width:44px;height:44px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);font-size:26px;line-height:1}
.navb:disabled{opacity:.3;cursor:default}
.sumbody{display:flex;flex-direction:column;gap:14px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 0 var(--line)}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-size:30px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .d{font-size:13px;color:var(--muted)}
.tile .up{color:var(--ok);font-weight:700}.tile .down{color:var(--warn);font-weight:700}
.card{background:var(--card);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;box-shadow:0 2px 0 var(--line)}
.card h3{margin:0;font-size:17px}
.card .sub{margin:0;font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--f);fill:var(--muted);font-size:13px}
.chart .val{fill:var(--ink);font-weight:700;font-size:14px}
.hb{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;font-size:15px}
.hb .tr{height:14px;background:var(--cell);border-radius:7px;overflow:hidden}
.hb .fi{height:100%;background:var(--gold);border-radius:7px}
.hb .n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.m{color:var(--muted)}
.tscroll{overflow-x:auto}
.ttab{border-collapse:separate;border-spacing:4px;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.ttab th{font-weight:600;color:var(--muted);font-size:13px;padding:2px 4px;text-align:center;white-space:nowrap}
.ttab th:first-child{text-align:left}
.ttab td{text-align:center;border-radius:8px;padding:6px 4px;white-space:nowrap}
.ttab td:first-child{text-align:left;font-weight:700}
.ttab .ok{background:var(--ok-soft)}
.ttab .late{background:var(--warn-soft);color:var(--warn);font-weight:700}
.ttab .miss{color:var(--muted)}
.ttab .rest{background:var(--gold-soft)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.facts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.dlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.dlist li{display:grid;grid-template-columns:28px 34px 1fr auto;gap:8px;align-items:center;font-size:16px}
.dlist .o{color:var(--muted);font-weight:700;text-align:center}
.dlist .e{font-size:24px}
.pill{font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.pill.miss{background:var(--cell);color:var(--muted)}
.pill.rest{background:var(--gold-soft);color:var(--ink)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:clamp(18px,6vw,56px);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);z-index:15}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--faint);font-weight:700;position:relative;min-width:56px}
.tabbar .ti{font-size:30px;line-height:1;filter:grayscale(1);opacity:.55}
.tabbar button[aria-selected="true"]{color:var(--blue)}
.tabbar button[aria-selected="true"] .ti{filter:none;opacity:1}
.dateico{display:inline-flex;flex-direction:column;width:32px;height:32px;border-radius:7px;overflow:hidden;background:#fff;box-shadow:0 0 0 1.5px currentColor;font-size:16px;font-weight:900;line-height:1;color:var(--ink)}
.dateico i{display:block;height:8px;background:#E5483D}
.dateico b{flex:1;display:grid;place-items:center}
.tabbar .badge{position:absolute;top:-4px;right:6px;background:#E5483D;color:#fff;border-radius:999px;font-size:12px;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;font-size:18px;z-index:30;pointer-events:none;white-space:nowrap}
.fly{position:fixed;font-size:48px;z-index:40;pointer-events:none;transition:transform .9s cubic-bezier(.3,.7,.3,1),opacity .9s}

/* parent sheet */
.shade{position:fixed;inset:0;background:var(--shade);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.sheet{background:var(--card);color:var(--ink);width:100%;max-width:680px;max-height:100%;overflow:auto;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:16px}
.sheet h2{margin:0;font-size:22px}
.sheet h3{margin:0;font-size:17px}
.sheet .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sheet label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.sheet input,.sheet textarea,.sheet select{font:inherit;font-size:16px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);color:var(--ink);min-width:0}
.sheet textarea{width:100%;min-height:90px}
.tlist{display:flex;flex-direction:column;gap:8px}
.tl-item{display:flex;align-items:center;gap:12px;background:var(--cell);border-radius:14px;padding:10px 14px}
.tl-item .emo{font-size:28px;width:44px;height:44px;border-radius:12px;display:grid;place-items:center}
.tl-item .nm{font-weight:700}
.tl-item .ds{font-size:13px;color:var(--muted)}
.tl-item button{margin-left:auto;color:var(--blue);font-weight:700}
.emoNow{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:38px;flex:none;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.emopick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:260px;overflow-y:auto;background:var(--cell);border-radius:14px;padding:10px}
.emopick .eg{grid-column:1/-1;font-size:13px;color:var(--muted);font-weight:700;margin-top:4px}
.emopick button{font-size:28px;height:46px;border-radius:12px;border:2.5px solid transparent;background:var(--card)}
.emopick button[aria-pressed="true"]{border-color:var(--blue);background:var(--gold-soft)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:10px;border:3px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.dtab{width:100%;border-collapse:collapse;font-size:15px}
.dtab th{font-weight:600;color:var(--muted);font-size:13px;text-align:left;padding:4px}
.dtab td{padding:4px}
.dtab input[type=checkbox]{width:22px;height:22px;accent-color:var(--blue)}
.dtab input[type=time]{width:100%}
.err{color:var(--warn);font-size:14px;margin:0}
.small{font-size:13px;color:var(--muted);margin:0}
.danger{color:var(--warn)!important}

@media (max-width:600px){
  .ttl{font-size:19px}.ttl span{margin:0 5px}
  .cell{font-size:18px;border-width:2px}.cell.full::after{font-size:10px;right:3px}
  .tc{grid-template-columns:auto 1fr auto;padding:14px}.tc .ic{width:46px;height:46px;font-size:26px}.tc .nm{font-size:20px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hb{grid-template-columns:90px 1fr 48px}
  .pet .stage{width:220px;height:220px}.petscale{height:212px}
  .pj .st b{font-size:22px}
}
@media (prefers-reduced-motion: reduce){#bun,#bun.hop{animation:none}.fly{transition:none}}

@font-face{font-family:"Xiaolai";src:url(zheng/font.woff2) format("woff2");font-display:swap;unicode-range:U+3000-303F,U+4E00-9FFF,U+FF01-FF0F,U+FF1A-FF5E}
:root{
  /* 星光魔法学院 palette, shared with 古筝陪练 and the magic tab: cream ground, plum ink, lilac actions, gold stars */
  --bg:#FBF5EE; --card:#FFFFFF; --cell:#F6EFFA; --ink:#4A3A5C; --muted:#8E7FA3; --faint:#CBBEDA; --line:#ECE1F4;
  --blue:#8E6FD8; --gold:#F2C14E; --gold-soft:#FFF4D6; --night:#6B4FB8; --ok:#4FB38A; --ok-soft:#E2F4EA; --warn:#E26D8C; --warn-soft:#FBE6EE;
  --pink:#E07BC0; --coral:#9B7BF0; --shade:rgba(74,58,92,.42); --meadow:#E6F3E2; --doodle:#EDE3F7;
  --f:"XiaolaiS","Xiaolai",ui-rounded,"SF Pro Rounded","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
}
body{font-synthesis:none}
h1,h2,h3,b,strong,th{font-weight:normal}
.ttl{font-weight:normal;font-size:30px;color:var(--coral);text-shadow:2px 2px 0 #fff,4px 4px 0 var(--doodle);letter-spacing:.04em}
.ttl span{color:var(--faint)} .ttl em{color:var(--blue)}
.round{border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.round:active,.btn:active,.tc:active,.mi:active,.cal-foot button:active{transform:translateY(3px)}
/* bunny greeting on 今天 */
.coach{display:flex;align-items:flex-end;gap:10px}
.coach img{width:116px;margin:-14px -14px -8px -16px;flex:none;filter:drop-shadow(0 4px 0 rgba(255,150,120,.25));transform-origin:50% 100%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px) rotate(-2deg)}}
.coach .say{position:relative;flex:1;min-width:0;background:var(--card);border:3px solid var(--pink);border-radius:22px;padding:10px 16px;margin-bottom:14px;font-size:21px;color:var(--coral);line-height:1.4}
.coach .say small{display:block;font-size:15px;color:var(--muted)}
.coach .say::before{content:"";position:absolute;left:-14px;bottom:18px;border:8px solid transparent;border-right:10px solid var(--pink)}
.coach .say::after{content:"";position:absolute;left:-8px;bottom:20px;border:6px solid transparent;border-right:8px solid var(--card)}
/* boxes and calendar */
.box,.card,.tile,.allgood,.pj,.pet{border-radius:26px;border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.cal-h b{font-size:21px;color:var(--coral)}
.cal-h button{background:var(--cell);border-radius:50%;color:var(--coral)}
.cal-dn{font-size:15px}
.cal-dn.today{color:var(--coral)}
.cell{border-radius:16px;background:var(--cell);color:var(--muted);font-weight:normal}
.cell.today{border-color:var(--coral);color:var(--coral);background:#fff}
.cell.sel:not(.today){border-color:var(--blue)}
.cell.full{background:linear-gradient(160deg,#FFD25A,#FFA443);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.cell.full::after{font-size:15px}
.cal-foot button{background:var(--cell);color:var(--coral);border-radius:999px;box-shadow:0 3px 0 var(--line)}
/* rules strip */
.rules{background:linear-gradient(135deg,#B49CFF,#9F84FF);border-radius:24px;box-shadow:0 5px 0 #7F66E0}
.rules h2{font-size:15px;opacity:.95;letter-spacing:.04em}
.rules div{font-weight:normal;opacity:1}
.rules .rb{font-weight:normal;background:rgba(255,255,255,.25);border-radius:999px;padding:4px 14px}
.rules .rb.add{border-radius:999px}
.banner{border-radius:20px;font-weight:normal}
.hintline b{color:var(--coral);font-size:22px}
.linkb{color:var(--blue);font-weight:normal}
.past{border-radius:18px}
/* task cards */
.tc{border-radius:26px;box-shadow:0 6px 0 color-mix(in srgb,var(--c) 68%,#000);min-height:100px}
.tc .ic{border-radius:50%;background:rgba(255,255,255,.3);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.tc .nm{font-weight:normal;font-size:26px}
.tc .ht{font-family:"PingFang SC",system-ui,sans-serif}
.tc .tg{font-weight:normal;border-radius:999px;padding:1px 12px}
.tc .box2{border-radius:16px;font-weight:normal;box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.tc .num{background:var(--coral);color:#fff;font-weight:normal;border:3px solid #fff;width:38px;height:38px}
.tc.next{outline:4px dashed var(--gold);outline-offset:4px}
.tc .nextlbl{font-weight:normal;border-radius:999px;padding:0 8px}
.zlink{font-weight:normal;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 45%,transparent)}
.mi{border-radius:24px;border-width:3px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 40%,transparent)}
.mi .n{font-weight:normal}
.mi.on{box-shadow:0 5px 0 color-mix(in srgb,var(--c) 68%,#000)}
.mi .no{background:var(--coral);color:#fff;font-weight:normal;border:3px solid #fff}
.btn{border-radius:999px;font-weight:normal;border:3px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.main{background:var(--coral);border-color:var(--coral);box-shadow:0 5px 0 #6B4FB8}
.allgood b{color:var(--coral);font-size:28px}
.moods button{border-radius:20px}
.foot b{background:var(--pink);color:#fff;font-weight:normal}
/* projects, pet, summary */
.rw{border-radius:20px;border-width:2.5px}
.rw .t{font-weight:normal}
.rw .go{font-weight:normal;border-radius:999px;box-shadow:0 3px 0 #D99A00}
.pj .hd .nm,.pj .hd .big b,.pj .st b,.tile .v,.pet .pname{font-weight:normal}
.pj .strip i{border-radius:50%}
.pet .bubble{border:3px solid var(--pink);border-radius:18px;font-weight:normal;color:var(--coral)}
.pet .pbar,.hb .tr,.rw .bar{border-radius:999px}
.pet .pbar i,.hb .fi,.rw .bar i{background:linear-gradient(90deg,#FFD25A,#FFA443);border-radius:999px}
.petpop .pb{border:3px solid var(--pink);border-radius:18px 18px 4px 18px;font-weight:normal;color:var(--coral)}
.wardrobe button{font-weight:normal}
.seg{border-radius:999px;border-width:3px}
.seg button{border-radius:999px;font-weight:normal}
.seg button[aria-pressed="true"]{background:var(--coral)}
.navb{border-width:3px;color:var(--coral)}
.tile{border-color:color-mix(in srgb,var(--blue) 30%,var(--line))}
.card h3{color:var(--coral)}
.pill{font-weight:normal}
/* tab bar */
.tabbar{background:rgba(255,255,255,.92);border-top:3px solid var(--line);border-radius:26px 26px 0 0}
.tabbar button{font-weight:normal;font-size:14px;padding:4px 10px;border-radius:18px}
.tabbar button[aria-selected="true"]{color:var(--coral);background:var(--cell)}
.tabbar .ti{font-size:30px}
.dateico{font-weight:normal}
.toast{background:var(--coral);font-weight:normal;box-shadow:0 5px 0 #6B4FB8}
.sheet{border-radius:26px;font-family:"PingFang SC",system-ui,sans-serif}
.sheet h2,.sheet h3{font-family:var(--f);color:var(--coral)}
@media (max-width:600px){.ttl{font-size:23px}.coach img{width:96px}.coach .say{font-size:18px}}
@media (prefers-reduced-motion: reduce){.coach img{animation:none}}

/* ============ compact + cuter (2026-10, v2): smaller blocks, pastel task colours, stars for done ============ */
body{font-size:16px}
.wrap{gap:12px;padding-block:10px calc(100px + env(safe-area-inset-bottom,0px))}
.ttl{font-size:26px}
.ttl::before{content:"🐰";margin-right:6px;font-size:.9em;text-shadow:none}
.round{min-width:42px;height:42px;font-size:18px}
/* bunny greeting */
.coach img{width:92px;margin:-12px -12px -6px -14px}
.coach .say{font-size:18px;padding:8px 14px;margin-bottom:10px;border-radius:20px}
.coach .say small{font-size:13px}
/* calendar: short cells instead of big squares */
.box{padding:10px 12px;border-radius:22px}
.cal-h{margin-bottom:2px}.cal-h b{font-size:18px}.cal-h button{width:34px;height:34px;font-size:18px}
.cal-dn{font-size:13px;padding:2px 0}
.cal-grid{gap:5px}
.cell{aspect-ratio:auto;height:46px;max-height:none;font-size:18px;border-radius:14px;border-width:2.5px}
.cell .mo{font-size:9px}
.cell .dots{height:6px;margin-top:1px}.cell .dots i{width:6px;height:6px}
.cell.full::after{content:"⭐";top:-7px;right:-5px;font-size:17px}
.cal-foot{margin-top:6px}.cal-foot button{padding:4px 12px;font-size:13px}
/* rules strip */
.rules{padding:8px 14px;border-radius:20px;gap:4px 14px;box-shadow:0 4px 0 #7F66E0}
.rules h2{font-size:12px}
.rules div,.rules .rb{font-size:14px}
.rules .rb{padding:2px 12px}
.hintline{font-size:14px}.hintline b{font-size:19px}
/* task cards: shorter, pastel */
.tcards{gap:12px}
.tc{min-height:70px;padding:10px 14px;gap:12px;border-radius:22px;background:color-mix(in srgb,var(--c) 82%,#fff);box-shadow:0 5px 0 color-mix(in srgb,var(--c) 75%,#000)}
.tc .ic{width:46px;height:46px;font-size:26px;background:rgba(255,255,255,.4)}
.tc .nm{font-size:21px}
.tc .ht{font-size:13px}
.tc .tg{font-size:12px;margin-top:3px}
.tc .box2{width:42px;height:42px;font-size:26px;border-radius:14px}
.tc.done .box2{color:var(--gold);text-shadow:0 2px 0 #E89B00}
.tc.done{opacity:.8}
.tc.done::after{content:"✨";position:absolute;right:62px;top:6px;font-size:18px}
.tc .num{width:30px;height:30px;font-size:14px;top:-8px;left:-6px;border-width:2.5px}
.tc .nextlbl{font-size:11px}
.under{margin-top:-4px}
.zlink{font-size:14px;padding:5px 14px;border-width:2px}
.menu{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mi{min-height:96px;border-radius:20px;padding:8px 6px}
.mi .e{font-size:32px}.mi .n{font-size:16px}
.mi.on{background:color-mix(in srgb,var(--c) 82%,#fff)}
.btn{padding:9px 18px}
.allgood{padding:14px}.allgood b{font-size:22px}
.moods button{font-size:30px;padding:4px 8px}
/* projects: two columns of small cards */
#pjs{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.pj{border-radius:22px;box-shadow:0 4px 0 var(--line)}
.pj .hd{padding:8px 12px;gap:10px;background:color-mix(in srgb,var(--c) 82%,#fff)}
.pj .hd .ic{width:38px;height:38px;font-size:22px;border-radius:50%;background:rgba(255,255,255,.4)}
.pj .hd .nm{font-size:18px}
.pj .hd .ht{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pj .hd>div:nth-child(2){min-width:0}
.pj .hd .big b{font-size:26px}
.pj .hd .big small{font-size:11px}
.pj .st{padding:6px 12px;gap:6px}
.pj .st span{font-size:12px}
.pj .st b{font-size:19px}
.pj .st b small{font-size:10px;padding:0 4px}
.pj .ft{padding:6px 12px;font-size:13px;gap:8px}
.pj .ft .since{font-size:11px}
.pj .strip{gap:2px}.pj .strip i{width:9px;height:9px}
.rw-h{font-size:15px}
.rws{grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:8px}
.rw{padding:8px 10px;gap:6px;border-radius:18px}
.rw .t{font-size:15px}.rw .t .e{font-size:20px}
.rw.add{min-height:54px;font-size:15px}
/* pet */
.pet{padding:18px 16px 16px;gap:10px}
.pet .stage{width:240px;height:240px}.petscale{height:232px}
.pet .pname{font-size:24px}
/* summary */
.tiles{gap:10px}.tile{padding:10px 12px;border-radius:20px}.tile .v{font-size:24px}
.card{padding:12px 14px;border-radius:22px}
.seg button{padding:6px 18px}
.navb{width:38px;height:38px;font-size:22px}
.nav h2{font-size:19px}
/* tab bar */
.tabbar{padding:6px 16px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .ti{font-size:26px}
.tabbar button[aria-selected="true"] .ti{animation:wiggle .5s}
@keyframes wiggle{30%{transform:rotate(-12deg) scale(1.15)}60%{transform:rotate(10deg) scale(1.1)}}
@media (max-width:600px){
  .ttl{font-size:21px}.coach img{width:80px}.coach .say{font-size:16px}
  .cell{height:40px;font-size:15px}.cell.full::after{font-size:14px}
  .tc .nm{font-size:18px}.tc .ic{width:40px;height:40px;font-size:22px}
  #pjs{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.tabbar button[aria-selected="true"] .ti{animation:none}}
/* tab bar: every icon sits in the same 34px box, so the five labels line up whatever the icon (emoji or the date) */
.tabbar{align-items:stretch}
.tabbar button{justify-content:flex-end}
.tabbar .ti{height:34px;display:flex;align-items:center;justify-content:center}
.tabbar .ti .dateico{width:30px;height:30px}
/* the bunny pop-up leaves completely after talking, instead of stopping half off the screen */
.petpop{opacity:0;pointer-events:none;transform:translateY(40px);transition:transform .35s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.petpop.show{opacity:1;pointer-events:auto;transform:none}
.bkNote{display:block;margin:6px auto 0;background:none;border:1.5px dashed var(--faint);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted)}

/* ---------- 星光魔法学院 ---------- */
:root{--m-lilac:#B79CF2;--m-deep:#6B4FB8;--m-gold:#F2C14E;--m-night:#2B2560}
.mhall{position:relative;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.mhall img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;object-position:center 72%}
.mh-t{position:absolute;left:0;right:0;top:0;padding:14px 18px;display:flex;flex-direction:column;gap:2px;color:#fff;background:linear-gradient(rgba(43,37,96,.55),transparent)}
.mh-t b{font-size:26px;text-shadow:0 2px 6px rgba(0,0,0,.35)}.mh-t span{font-size:15px;opacity:.95}
.mh-go{position:absolute;left:0;right:0;bottom:6%;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px}
.mbtn.music{background:linear-gradient(135deg,#F2A65A,#E07BC0);box-shadow:0 5px 0 #B8603A}
.mhint{margin:6px 0 0;color:var(--muted);font-size:14px}
.mbtn{border:0;border-radius:999px;padding:14px 26px;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#9B7BF0,#E07BC0);box-shadow:0 5px 0 #6B4FB8}
.mbtn.glow{animation:mglow 1.6s ease-in-out infinite}
@keyframes mglow{50%{box-shadow:0 5px 0 #6B4FB8,0 0 26px 6px rgba(242,193,78,.85)}}
.mnote{background:rgba(255,255,255,.88);color:var(--m-deep);border-radius:999px;padding:9px 18px;font-size:16px;text-align:center}
.mspell{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:3px solid var(--m-lilac);border-radius:22px;padding:10px;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.mspell img{width:110px;height:110px;object-fit:cover;border-radius:16px}
.mspell.locked img{filter:grayscale(1) blur(3px);opacity:.6}
.mspell.ready{animation:mglow 1.6s ease-in-out infinite}
.ms-t{display:flex;flex-direction:column;gap:2px}.ms-t small{color:var(--muted);font-size:14px}.ms-t b{font-size:34px;color:var(--m-deep)}.ms-t em{font-style:normal;color:var(--muted)}
.mspell.done{display:flex;flex-direction:column;gap:4px;text-align:center}
.mbook{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-top:10px}
.mbook.six{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:640px){.mbook,.mbook.six{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mslot{position:relative;padding:0;border:0;background:none}
.mcard{position:relative;border-radius:14px;padding:5px;aspect-ratio:3/4;display:flex;flex-direction:column;background:linear-gradient(160deg,#E9E3F8,#CFC3EE);box-shadow:0 3px 0 rgba(107,79,184,.25)}
.mcard img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.mcard.r1{background:linear-gradient(160deg,#FFE9A8,#F2C14E 60%,#E3A12A)}
.mcard.r2{background:linear-gradient(120deg,#FFB5D8,#C9B6FF,#9FE3FF,#B8F2C8,#FFE79A,#FFB5D8);background-size:300% 300%;animation:mshine 4s linear infinite}
@keyframes mshine{to{background-position:300% 0}}
.mc-n{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--m-night);line-height:1.15;padding-top:3px}
.mc-n b{font-size:clamp(13px,1.8vw,18px)}.mc-n span{font-size:clamp(10px,1.2vw,13px);opacity:.8}
.mc-r{position:absolute;top:8px;left:8px;font-style:normal;font-size:11px;background:rgba(255,255,255,.9);color:var(--m-deep);border-radius:999px;padding:1px 7px}
.mcard.back{align-items:center;justify-content:center;background:linear-gradient(160deg,#6B4FB8,#2B2560)}
.mcard.back span{font-size:clamp(28px,5vw,48px);color:rgba(242,193,78,.9)}
.mcard.back .mc-r{background:rgba(255,255,255,.18);color:#fff}
.mcard.gold{background:linear-gradient(135deg,#FFF3B0,#F2C14E 35%,#FFE680 55%,#D9971F);box-shadow:0 0 0 2px #F2C14E,0 0 14px rgba(242,193,78,.75);overflow:hidden}
.mcard.gold::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.65) 50%,transparent 65%);background-size:250% 100%;animation:mgold 2.8s linear infinite}
.mcard.gold .mc-r{background:#F2C14E;color:#5A3A00}
@keyframes mgold{from{background-position:150% 0}to{background-position:-100% 0}}
.mlocked{text-align:center;color:var(--muted);font-weight:600;border:2px dashed var(--line);background:transparent;box-shadow:none}
.mnew{margin:4px 0 0;font-weight:800;color:var(--m-deep)}
.mx{position:absolute;right:-4px;top:-6px;font-style:normal;background:var(--m-deep);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px}
.mspells{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.mchip{border:0;border-radius:999px;padding:8px 16px;background:#EFE8FF;color:var(--m-deep);font-size:20px;font-weight:700;display:flex;align-items:baseline;gap:6px}
.mchip small{font-size:13px;font-weight:normal;color:var(--muted)}.mchip.off{background:var(--cell);color:var(--faint)}
.mreveal,.mlearn{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mreveal p,.mlearn p{margin:0;color:var(--muted)}
.mreveal .row,.mlearn .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.mflip{position:relative;width:min(300px,70vw);perspective:900px}
.mflip .mcard{transition:transform .7s cubic-bezier(.3,1.3,.5,1),opacity .3s;backface-visibility:hidden}
.mflip .front0{position:absolute;inset:0;z-index:2}
.mcard.big .mc-n b{font-size:24px}.mcard.big .mc-n span{font-size:17px}.mcard.big .mc-r{font-size:14px}
.mreveal.new .mflip .big{transform:rotateY(180deg) scale(.85)}
.mreveal.open .mflip .front0{transform:rotateY(-180deg);opacity:0}
.mreveal.open .mflip .big{transform:none}
.mlearn img{width:min(320px,72vw);border-radius:20px}
.mword{font-size:clamp(44px,9vw,64px)!important;color:var(--m-deep);letter-spacing:.02em}
.mline{font-size:20px;color:var(--ink)!important}
.mtip{color:var(--muted)}
#mGoDraw{display:block;margin:0 auto}
@media (prefers-reduced-motion: reduce){.mbtn.glow,.mspell.ready,.mcard.r2,.mcard.gold::after{animation:none}}

/* academy tone for task cards: a light card with the task's colour softened into a stripe, an icon disc and the tick box,
   instead of a solid saturated block (the parent's chosen colour still tells the tasks apart) */
.tc{--cs:color-mix(in srgb,var(--c) 62%,#fff);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 16%,#fff),#fff 70%);color:var(--ink);
  border:2px solid color-mix(in srgb,var(--c) 30%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 26%,#fff);overflow:visible}
.tc::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:7px;border-radius:0 6px 6px 0;background:var(--cs)}
.tc .ic{background:color-mix(in srgb,var(--c) 22%,#fff);box-shadow:none}
.tc .ht{opacity:1;color:var(--muted)}
.tc .tg{background:color-mix(in srgb,var(--c) 16%,#fff);color:var(--ink)}
.tc .box2{background:#fff;border:2.5px solid var(--cs);color:var(--gold);box-shadow:none}
.tc.done .box2{background:var(--gold-soft);border-color:var(--gold)}
.tc .nextlbl{background:var(--cs);color:#fff}
.tc.pick .box2{background:#fff;color:var(--cs)}
.pj .hd{--cs:color-mix(in srgb,var(--c) 62%,#fff);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 18%,#fff),#fff 75%);color:var(--ink);border-bottom:2px solid color-mix(in srgb,var(--c) 28%,#fff)}
.pj .hd .ic{background:color-mix(in srgb,var(--c) 24%,#fff)}
.pj .hd .ht{opacity:1;color:var(--muted)}
.pj .hd .big b{color:var(--cs)}
.mi{border-color:color-mix(in srgb,var(--c) 32%,#fff);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 22%,#fff)}
.mi.on{background:color-mix(in srgb,var(--c) 18%,#fff)!important;border-color:color-mix(in srgb,var(--c) 70%,#fff)!important;box-shadow:0 4px 0 color-mix(in srgb,var(--c) 40%,#fff)!important}
.mi.on .n{color:var(--ink)!important}
/* watercolour icons (magic/icons/) */
.tabbar .ti img{height:32px;width:32px;object-fit:contain}
.tabbar .ti{filter:grayscale(.75);opacity:.6}
.tabbar button[aria-selected="true"] .ti{filter:none;opacity:1}
.dateico i{background:#9B7BF0}
.round .rico{width:26px;height:26px;object-fit:contain;display:block}
img.tico{width:78%;height:78%;object-fit:contain;display:block;margin:auto}
.mi .e img.tico{width:52px;height:52px}
.tl-item .emo img.tico,.oline .e img.tico,li .e img.tico{width:26px;height:26px;display:inline-block;vertical-align:middle}
.emopick .wcgrid{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.emopick button.wc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:auto;min-height:78px;padding:6px 2px}
.emopick button.wc img.tico{width:38px;height:38px;margin:0}
.emopick button.wc span{font-size:12px;line-height:1.15;color:var(--muted);text-align:center;white-space:normal}
.emopick button.wc[aria-pressed="true"] span{color:var(--night)}
.emoNow img.tico{width:80%;height:80%}
.arch .ar{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.arch .ar .ic{grid-row:1/3;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;background:var(--cell);font-size:22px;opacity:.75}
.arch .ar .nm{font-size:17px;color:var(--muted)}.arch .ar .ds{font-size:13px;color:var(--faint)}
.tl-item.arch{opacity:.7}

/* 2026-11 魔力瓶说明（给孩子看） */
.bhelp{display:block;margin:8px auto 0;border:2px solid var(--gold);background:var(--gold-soft);color:#8A5A06;border-radius:999px;padding:6px 16px;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.bh{display:flex;flex-direction:column;gap:12px;font-family:"Xiaolai","XiaolaiS",var(--f)}
.bh-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bh-top h2{margin:0;font-size:24px}
.bh-top .x{border:0;background:var(--cell);border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer}
.bh-lead{margin:0;font-size:17px;line-height:1.55}
.bh-box{background:var(--cell);border-radius:18px;padding:12px 14px}
.bh-box h3{margin:0 0 8px;font-size:19px}
.bh-box.mus{background:var(--ok-soft)}
.bh-mine{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bh-mine div{background:var(--gold-soft);border-radius:14px;padding:8px;text-align:center}
.bh-mine b{display:block;font-size:28px;color:#B4760E;line-height:1.1}
.bh-mine span{font-size:14px;color:var(--muted)}
.bh-fill{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:15px}
.bh-fill .bar{flex:1;height:14px;border-radius:999px;background:#fff;overflow:hidden}
.bh-fill .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#F7C3D2,#C9A6F0)}
.bh-rule{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:2px dashed var(--line);font-size:17px}
.bh-rule:first-of-type{border-top:0}
.bh-rule .ic{font-size:28px;text-align:center}
.bh-rule small{display:block;font-size:13px;color:var(--muted)}
.bh-rule .pt{font-size:20px;color:#C9607E;white-space:nowrap}
.bh-eq{background:#FCE6EE;border-radius:14px;padding:8px 12px;font-size:16px;margin-top:6px}
.bh-eq b{color:#B85A78}
.bh-eq.vio{background:#EEE8FB}.bh-eq.vio b{color:#6C4FC4}
.bh-tier{margin:0 0 6px;font-size:14px;color:var(--muted)}
.bh-items{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bh-items div{background:#fff;border-radius:12px;padding:5px 6px;display:flex;align-items:center;gap:4px;font-size:14px}
.bh-items img{width:34px;height:34px;object-fit:contain}
.bh-items span{margin-left:auto;font-size:13px;color:#B4760E;white-space:nowrap}
.bh-rw{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:7px 12px;margin-bottom:6px;font-size:16px}
.bh-rw span{margin-left:auto;color:#B4760E;white-space:nowrap}
.bh-lad{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.bh-lad div{display:flex;align-items:center;gap:6px;background:#EEE8FB;border-radius:12px;padding:6px 10px;font-size:15px}

function todayKey(){ return dkey(now()); }
// archived tasks (t.archived = the day it was put away) leave the menu, plans and reminders; their history stays
const activeTasks = () => S.tasks.filter(t=>!t.archived);
function tasksOn(dow){ return activeTasks().filter(t=>t.days[dow] && t.days[dow].on); }
function dayLog(k){ return S.log[k] ||= {order:null, done:{}, rest:null, mood:null}; }
function restUsedThisWeek(){
  const m = monday(now());
  for (let i=0;i<7;i++){ const x=new Date(m); x.setDate(m.getDate()+i); const l=S.log[dkey(x)]; if (l && l.rest) return dkey(x); }
  return null;
}

function renderCal(){

  else { const first=new Date(y,mo,1,12); first.setDate(1-first.getDay()); const startK=dkey(first); const last=new Date(y,mo+1,0,12); const cells=Math.ceil((first.getDay()+ (last.getDate() + new Date(y,mo,1).getDay()))/7)*7;
    keys=[...Array(cells)].map((_,i)=>addDays(startK,i)); }
  keys.forEach(k=>{

    const x=dayInfo(k); let dots="";
    if (x.active){ if (x.done + (x.rest?1:0) >= x.planned) cls+=" full"; else dots = x.ids.filter(id=>x.L.done[id]).map(id=>`<i style="background:${taskById(id).color||"#999"}"></i>`).join(""); }
    b.className=cls;
    b.innerHTML = (d.getDate()===1?`<span class="mo">${d.getMonth()+1}月</span>`:"") + `<span>${d.getDate()}</span>` + (dots?`<span class="dots">${dots}</span>`:"");

    if (k>tk) b.disabled=true; else b.onclick=()=>{ selDay=k; render(); };
    g.appendChild(b);
  });
}

// Each day keeps its own times in L.times = {id:{at,by}}; a project's own at/by is only the starting value.
function timesFor(id, k){ const L=S.log[k]; if (L && L.times && L.times[id]) return L.times[id]; const t=taskById(id); return {at:t.at||"", by:t.by||""}; }
function tagTxt(tm){ return tm.at ? tm.at+" 开始" : tm.by ? tm.by+" 前做完" : ""; }
function tagOf(id, k){ return tagTxt(timesFor(id,k)); }
// B: start from the same weekday last week (up to 4 weeks back); else the old weekly schedule.
function prefill(k){
  const exists=id=>S.tasks.some(t=>t.id===id);
  for (let w=1; w<=4; w++){
    const pk=addDays(k,-7*w), P=S.log[pk];
    if (P && P.order && P.order.length){ const order=P.order.filter(exists), times={}; order.forEach(id=>times[id]={...timesFor(id,pk)}); return {order, times, from: w===1?"上周"+DAY[new Date(k+"T12:00").getDay()]:"之前的周"+DAY[new Date(k+"T12:00").getDay()]}; }
  }
  const dow=new Date(k+"T12:00").getDay(), order=[], times={};
  activeTasks().forEach(t=>{ const d=t.days && t.days[dow]; if (d && d.on){ order.push(t.id); times[t.id]={at:d.at||t.at||"", by:d.by||t.by||""}; } });
  return {order, times, from: order.length ? "平时的安排" : ""};
}
let picking=[], pickTimes={}, pickFor=null, pickFrom="", undoArm=null;
function startPicking(k, keep){
  const p=prefill(k); pickFor=k;
  if (keep){ picking=[...keep]; pickTimes={}; keep.forEach(id=>pickTimes[id]={...timesFor(id,k)}); pickFrom=""; }
  else { picking=p.order; pickTimes=p.times; pickFrom=p.from; }
}

function taskDayState(t, k){ // "done" | "rest" | "miss" (picked, not done) | "off" (not picked)
  const L=S.log[k];
  if (L && L.order && L.order.includes(t.id)){ if (L.done[t.id]) return "done"; if (L.rest===t.id) return "rest"; return "miss"; }
  return "off"; // not picked that day: neither keeps nor breaks a streak
}
function streakInfo(t, fromKey){
  const tk=todayKey(), st=startKey(); if (!st) return {cur:0, best:0, total:0, month:0, since:null};
  const from = fromKey && fromKey>st ? fromKey : st;
  let cur=0, best=0, run=0, total=0, month=0, since=null; const mp=tk.slice(0,7);
  for (let k=from; k<=tk; k=addDays(k,1)){
    const s=taskDayState(t,k);
    if (s==="done"){ total++; if (k.startsWith(mp)) month++; if(!since) since=k; }
    if (s==="done"||s==="rest"){ run++; best=Math.max(best,run); }
    else if (s==="miss" && k!==tk) run=0;
  }
  cur=run;
  return {cur, best, total, month, since};
}
function rewardProgress(r){
  if (r.kind==="bottles") return bottlesLeft();
  if (r.kind==="streak"){ const t=S.tasks.find(x=>x.id===r.task); return t ? streakInfo(t, r.created).best : 0; }
  let n=0; for (const k in S.log){ if (k>=r.created) n+=Object.keys(S.log[k].done||{}).length; } return n;
}

       <div class="legend"><span><i style="background:var(--ok-soft)"></i>✓ 做完</span><span><i style="background:var(--warn-soft)"></i>⚠ 超过规定时间</span><span>— 没做</span></div></div>`
    + `<div class="card"><h3>这周的发现</h3><ul class="facts">${weekFacts(W)}</ul></div>`;
}
function weekBars(off){
  const ks=weekDays(off), info=ks.map(dayInfo);
  const maxN=Math.max(5,...info.filter(x=>x.active).map(x=>x.planned));
  const Wd=700, H=230, top=26, base=190, slot=Wd/7, bw=46, h=n=>n/maxN*(base-top);
  let g=`<line x1="10" x2="${Wd-10}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="2"/>`;
  info.forEach((x,i)=>{
    const cx=slot*i+slot/2, lbl=`周${DAY[x.dow]}`;
    if (x.active){
      const ph=h(x.planned), dh=h(x.done);
      g+=`<g><title>${lbl}：做完 ${x.done} 件，共 ${x.planned} 件${x.rest?"（用了休息券）":""}</title>
        <rect x="${cx-bw/2}" y="${base-ph}" width="${bw}" height="${ph}" rx="4" fill="var(--line)" opacity=".7"/>
        ${x.done?`<rect x="${cx-bw/2}" y="${base-dh}" width="${bw}" height="${dh}" rx="4" fill="var(--gold)"/>`:""}
        <text class="val" x="${cx}" y="${base-ph-8}" text-anchor="middle">${x.done}/${x.planned}</text></g>`;
      if (x.L.mood) g+=`<text x="${cx}" y="${base+44}" text-anchor="middle" style="font-size:18px">${x.L.mood}</text>`;
    } else g+=`<text x="${cx}" y="${base-10}" text-anchor="middle">${x.future?"":"未开始"}</text>`;
    g+=`<text x="${cx}" y="${base+22}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${lbl}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${Wd} ${H+20}" role="img" aria-label="每天完成件数">${g}</svg>`;
}
function taskBars(W){
  const agg={};
  W.days.forEach(x=>x.ids.forEach(id=>{ agg[id] ||= {p:0,d:0,r:0}; if (x.rest===id) agg[id].r++; else { agg[id].p++; if (x.L.done[id]) agg[id].d++; } }));
  return Object.entries(agg).map(([id,v])=>{ const t=taskById(id), pc=v.p?Math.round(v.d/v.p*100):0;
    return `<div class="hb"><span>${esc(t.emo+" "+t.name)}</span><span class="tr" title="${pc}%"><span class="fi" style="width:${pc}%;display:block"></span></span><span class="n">${v.d}/${v.p}${v.r?` <small class="m">+券</small>`:""}</span></div>`; }).join("");
}
function timeTable(off){
  const ks=weekDays(off), info=ks.map(dayInfo).filter(x=>x.active);
  const ids=[...new Set(info.flatMap(x=>x.ids))];
  let h=`<div class="tscroll"><table class="ttab"><tr><th>任务</th>${info.map(x=>`<th>周${DAY[x.dow]}</th>`).join("")}</tr>`;
  ids.forEach(id=>{ const t=taskById(id);
    h+=`<tr><td>${esc(t.emo+" "+t.name)}</td>`+info.map(x=>{
      if (!x.ids.includes(id)) return `<td></td>`;
      if (x.rest===id) return `<td class="rest">🎟 券</td>`;
      const tm=x.L.done[id]; if (!tm) return `<td class="miss">—</td>`;
      const late=lateness(id,x.k,x.dow), dd=timesFor(id,x.k);
      return late ? `<td class="late" title="规定 ${dd.by} 前">⚠ ${tm}</td>` : `<td class="ok">✓ ${tm}</td>`;
    }).join("")+`</tr>`; });
  return h+`</table></div>`;
}
function weekFacts(W){
  const f=[];
  const first={}; W.days.forEach(x=>{ const id=x.ids[0]; first[id]=(first[id]||0)+1; });
  const fe=Object.entries(first).sort((a,b)=>b[1]-a[1])[0];
  if (fe) f.push(`最常第一个做：<b>${esc(taskById(fe[0]).emo+" "+taskById(fe[0]).name)}</b>（${fe[1]} 天）`);
  const full=W.days.filter(x=>x.done + (x.rest?1:0) >= x.planned).length;
  f.push(`全部做完的日子：<b>${full}</b> / ${W.days.length} 天`);
  const lastT=W.days.map(x=>Object.values(x.L.done).sort().pop()).filter(Boolean).sort();
  if (lastT.length) f.push(`最后一件事最晚 <b>${lastT[lastT.length-1]}</b> 做完`);
  const restDay=W.days.find(x=>x.rest); if (restDay) f.push(`休息券用在 周${DAY[restDay.dow]} 的 ${esc(taskById(restDay.rest).name)}`);
  if (W.byN && W.byOk<W.byN) f.push(`有 ${W.byN-W.byOk} 次超过了规定时间，可以和孩子聊聊怎么排顺序`);
  return f.map(x=>`<li>${x}</li>`).join("");
}

function dayHTML(k){
  const x=dayInfo(k);
  if (!x.active) return `<div class="card empty">${x.before?"这一天还没开始用Yuni打卡。":"这一天没有记录。"}</div>`;
  const dd=id=>timesFor(id,k);
  const items=x.ids.map((id,i)=>{ const t=taskById(id), tm=x.L.done[id], late=lateness(id,k,x.dow);
    const pill = x.rest===id ? `<span class="pill rest">🎟 休息券</span>` : !tm ? `<span class="pill miss">没做</span>` : late ? `<span class="pill late">⚠ ${tm} 超时</span>` : `<span class="pill ok">✓ ${tm}</span>`;
    return `<li><span class="o">${i+1}</span><span class="e">${taskIco(t)}</span><span>${esc(t.name)}${dd(id).by?` <small class="m">${dd(id).by} 前</small>`:dd(id).at?` <small class="m">${dd(id).at} 开始</small>`:""}</span>${pill}</li>`; }).join("");
  const pct=Math.round(x.done/Math.max(1,x.planned-(x.rest?1:0))*100);
  return `<div class="tiles">
      <div class="tile"><span class="k">完成</span><span class="v">${x.done}/${x.planned}</span><span class="d">${pct}%${x.rest?" · 用了休息券":""}</span></div>
      <div class="tile"><span class="k">得到星星</span><span class="v">★ ${x.done}</span><span class="d">&nbsp;</span></div>
      <div class="tile"><span class="k">最后一件做完</span><span class="v">${Object.values(x.L.done).sort().pop()||"—"}</span><span class="d">睡觉准备 ${S.bed}</span></div>
      <div class="tile"><span class="k">心情</span><span class="v">${x.L.mood||"—"}</span><span class="d">&nbsp;</span></div>
    </div>
    <div class="card"><h3>他排的顺序和完成情况</h3><ol class="dlist">${items}</ol></div>
    <div class="card"><h3>时间线</h3><p class="sub">每件事做完的时间；虚线是规定的时间</p>${dayTimeline(x)}</div>`;
}
function dayTimeline(x){
  const W=700, base=96, pts=[];
  x.ids.forEach(id=>{ const tm=x.L.done[id]; if (tm) pts.push({id, m:mins(tm), tm}); });
  const marks=[]; x.ids.forEach(id=>{ const d=timesFor(id,x.k); if (d.by) marks.push({m:mins(d.by), lab:taskById(id).name+" "+d.by+" 前"}); if (d.at) marks.push({m:mins(d.at), lab:taskById(id).name+" "+d.at}); });
  marks.push({m:mins(S.bed), lab:"🌙 "+S.bed});
  const all=[...pts.map(p=>p.m), ...marks.map(m=>m.m)];
  let t0=Math.floor((Math.min(...all)-30)/60)*60, t1=Math.ceil((Math.max(...all)+20)/60)*60;
  const X=m=>30+(m-t0)/(t1-t0)*(W-60);
  let g=`<line x1="30" x2="${W-30}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="2"/>`;
  for (let h=t0; h<=t1; h+=60) g+=`<line x1="${X(h)}" x2="${X(h)}" y1="${base-4}" y2="${base+4}" stroke="var(--line)" stroke-width="2"/><text x="${X(h)}" y="${base+22}" text-anchor="middle">${h/60}:00</text>`;
  marks.sort((a,b)=>a.m-b.m).forEach((mk,i)=>{ g+=`<line x1="${X(mk.m)}" x2="${X(mk.m)}" y1="20" y2="${base}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${X(mk.m)}" y="${i%2?150:136}" text-anchor="middle" style="font-size:12px">${esc(mk.lab)}</text>`; });
  pts.sort((a,b)=>a.m-b.m); let lastX=-99, lvl=0;
  pts.forEach(p=>{ const px=X(p.m); lvl = px-lastX<44 ? (lvl+1)%2 : 0; lastX=px; const ey=lvl?32:56;
    const late=lateness(p.id,x.k,x.dow);
    g+=`<g><title>${esc(taskById(p.id).name)} ${p.tm} 做完${late?"（超时）":""}</title><line x1="${px}" x2="${px}" y1="${ey+8}" y2="${base}" stroke="${late?"var(--warn)":"var(--gold)"}" stroke-width="2"/>
      <circle cx="${px}" cy="${base}" r="8" fill="${late?"var(--warn)":"var(--gold)"}" stroke="var(--card)" stroke-width="2"/>
      <text x="${px}" y="${ey}" text-anchor="middle" style="font-size:20px">${esc(taskById(p.id).emo)}</text></g>`; });
  return `<svg class="chart" viewBox="0 0 ${W} 160" role="img" aria-label="完成时间线">${g}</svg>`;
}

let ctx=null, soundOn=false;
function chime(soft){
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if (ctx.state==="suspended") ctx.resume();
    (soft?[784]:[659,784,988,1319]).forEach((f,i)=>{
      const o=ctx.createOscillator(), g=ctx.createGain(), t0=ctx.currentTime+i*0.12;
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.3,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+0.5);
      o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0+0.55);
    });
  }catch(e){}
}
function speak(text){
  try{ const u=new SpeechSynthesisUtterance(text); u.lang="zh-CN"; const v=speechSynthesis.getVoices().find(v=>/^zh[-_]CN/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
function toast(msg){
  const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function celebrate(el, t){
  chime();
  const r = el.getBoundingClientRect(), target = $("tabPet").getBoundingClientRect();
  const s=document.createElement("div"); s.className="fly"; s.textContent="⭐";
  s.style.left=(r.left+r.width/2-24)+"px"; s.style.top=(r.top-10)+"px"; document.body.appendChild(s);
  requestAnimationFrame(()=>{ s.style.transform=`translate(${target.left+target.width/2-r.left-r.width/2}px,${target.top+target.height/2-r.top}px) scale(.6)`; s.style.opacity="0.2"; });
  setTimeout(()=>s.remove(), 950);
  const praise = ["太棒了！","又一颗星星！","真厉害！","做得好！"];
  toast(t.name+" 完成，"+praise[Math.floor(Math.random()*praise.length)]);
}

function renderPet(){
  S.pet ||= {name:"", wear:[]}; seedBottleRewards();

  S.pet.owned ||= [];

      <div class="namebox"><input id="petName" maxlength="8" placeholder="比如：棉花糖"><button class="btn main" id="petNameOk" type="button">就叫这个</button></div>`;

const fired = new Set();

  const n=now(), dow=n.getDay(), k=dkey(n), cm=n.getHours()*60+n.getMinutes(), L=dayLog(k);
  const msgs=[];
  (L.order||[]).map(taskById).forEach(t=>{

  });

// ---------- bunny voice (English, pre-recorded, works offline) ----------
const voiceBuf = {};
function loadClip(f){
  if (voiceBuf[f]) return voiceBuf[f];
  const raw = f.startsWith("data:") ? Promise.resolve(Uint8Array.from(atob(f.split(",")[1]), c=>c.charCodeAt(0)).buffer) : fetch(f).then(r=>r.arrayBuffer());
  voiceBuf[f] = raw.then(b=>new Promise((ok,no)=>ctx.decodeAudioData(b,ok,no))).catch(()=>{ delete voiceBuf[f]; return null; });
  return voiceBuf[f];
}
function preloadVoice(){ if (!ctx) return; Object.values(VOICE_LINES).flat().forEach(([f])=>loadClip(f)); }
let lastLine = "";
function petSay(key){
  const list = VOICE_LINES[key]; if (!list) return;
  let pick = list[Math.floor(Math.random()*list.length)];
  if (list.length>1 && pick[1]===lastLine) pick = list[(list.indexOf(pick)+1)%list.length];
  lastLine = pick[1];
  sayPet(pick[1]); popPet(pick[1]);
  if (S.petVoice===false) return;
  try{
    ctx = ctx || new (window.AudioContext||window.webkitAudioContext)();
    if (ctx.state==="suspended") ctx.resume();
    loadClip(pick[0]).then(buf=>{ if(!buf) return; const s=ctx.createBufferSource(); s.buffer=buf; s.connect(ctx.destination); s.start(); });
  }catch(e){}
}

// ---------- backup: one file with 打卡 + 古筝陪练 (both live in this site's localStorage) ----------
const BK_KEYS=[KEY,"zheng1","zhengAuto",   // 古筝跟练（2026-11）：练习库、本周清单、练过记号、练习记录、每天清单完成情况、小伙伴、魔力瓶加点记录、设置

function backupAt(){ try{ return +localStorage.getItem("yuniBackupAt")||0; }catch(e){ return 0; } }
function backupDays(){ const t=backupAt(); return t ? Math.floor((Date.now()-t)/864e5) : -1; }
function backupAge(){ const d=backupDays(); return d<0 ? "还没有备份过" : d===0 ? "今天已经备份过 ✓" : `上次备份：${d} 天前`; }
function backupJSON(){
  const data={}; BK_KEYS.forEach(k=>{ try{ const v=localStorage.getItem(k); if(v!=null) data[k]=JSON.parse(v); }catch(e){} });
  return JSON.stringify({app:"Yuni打卡", v:1, at:new Date().toISOString(), data});
}
function markBackup(){ try{ localStorage.setItem(BK_AT, String(Date.now())); }catch(e){} }
async function doBackup(){
  const txt=backupJSON(), n=now(), name=`Yuni打卡备份-${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}.json`;
  const file=new File([txt], name, {type:"application/json"});
  // iPad: the share sheet → 存储到“文件” / 微信 / 隔空投送
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:name}); markBackup(); closeSheet(); toast("备份好了"); return; }
    catch(e){ if (e && e.name==="AbortError") return; }
  }
  backupText(txt);
}
function backupText(txt){
  sheet(`<h2>备份内容</h2><p class="small">点“复制”，再粘贴到备忘录或微信「文件传输助手」保存。</p><textarea id="bkt" readonly style="min-height:160px">${esc(txt)}</textarea>

  $("bkCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(txt); }catch(e){ $("bkt").select(); document.execCommand("copy"); } markBackup(); toast("已复制，去粘贴保存"); };

      <span class="small">找不到合适的？也可以自己打一个：<input id="tEmo" value="${esc(t.emo)}" maxlength="4" style="width:64px;font-size:20px;text-align:center"></span></div>

    ${timeFields({at:t.at||"", by:t.by||""})}
    <p class="small">时间可以不填。填了会显示在“今天不能变的事”里，到点提醒。某一天不一样的话，在“今天不能变的事”里点那一条就能改。</p>
    <p class="err" id="tErr" hidden></p>
    <div class="row2"><button class="btn main" id="tOk" type="button">${opt.fromHome?"加到菜单":"保存"}</button><button class="btn" id="tBack" type="button">${opt.fromHome?"取消":"返回"}</button>
      ${i>=0?'<button class="btn" id="tArc" type="button" style="margin-left:auto">🗂 不做了，归档</button><button class="btn danger" id="tDel" type="button">删除</button>':""}</div>

  bindTimeFields();
  let icon = t.icon;   // undefined = never picked (matched by name), "" = an emoji, else a watercolour icon
  const setEmo=e=>{ icon=""; $("tEmo").value=e; $("emoNow").textContent=e; $("emoPick").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(!x.dataset.i && x.dataset.e===e))); };
  const setIcon=n=>{ icon=n; $("emoNow").innerHTML=icoImg(n); $("emoPick").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x.dataset.i===n))); };
  // picking a watercolour icon while the name is still empty fills in its name (it can be changed)
  $("emoPick").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if (b.dataset.i){ setIcon(b.dataset.i); if (!$("tName").value.trim() && !["星星","礼物","铃铛"].includes(b.dataset.k)) $("tName").value=b.dataset.k; } else setEmo(b.dataset.e); });
  $("emoQ").oninput=()=>{ const q=$("emoQ").value.trim(); let any=false;
    $("emoPick").querySelectorAll("button").forEach(b=>{ const hit=!q || b.dataset.k.includes(q) || (b.dataset.e && b.dataset.e===q); b.hidden=!hit; any ||= hit; });
    $("emoPick").querySelectorAll(".eg").forEach(g=>{ if (g.id==="emoNone") return; let n=g.nextElementSibling, has=false; while(n && !n.classList.contains("eg")){ if(n.classList.contains("wcgrid") ? [...n.children].some(c=>!c.hidden) : !n.hidden) has=true; n=n.nextElementSibling; } g.hidden=!has; });
    $("emoNone").hidden=any; };
  $("tEmo").oninput=()=>setEmo($("tEmo").value.trim()||"⭐");
  $("sw").querySelectorAll("button").forEach(b=>b.onclick=()=>{ color=b.dataset.c; $("emoNow").style.background=color; $("sw").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", String(x===b))); });
  $("tBack").onclick= opt.fromHome ? closeSheet : parentHome;
  $("tOk").onclick=()=>{
    const name=$("tName").value.trim(); if(!name){ $("tErr").hidden=false; $("tErr").textContent="请写上名称。"; return; }
    const tm=readTimeFields();
    const nt={...t, emo:$("tEmo").value.trim()||"⭐", name, hint:$("tHint").value.trim(), color, at:tm.at, by:tm.by};
    if (icon!==undefined) nt.icon=icon; else delete nt.icon;
    if (i>=0) S.tasks[i]=nt; else S.tasks.push(nt);
    save();
    if (opt.fromHome){ if (!picking.includes(nt.id)){ picking.push(nt.id); pickTimes[nt.id]={at:nt.at, by:nt.by}; } closeSheet(); toast("新项目加好了"); }
    else parentHome();
  };
  if (i>=0) $("tArc").onclick=()=>{
    S.tasks[i].archived=todayKey();
    const L=S.log[todayKey()]; if (L && L.order && !L.done[S.tasks[i].id]) L.order=L.order.filter(id=>id!==S.tasks[i].id);   // not done today: off today's list too
    picking=picking.filter(id=>id!==S.tasks[i].id);
    save(); parentHome(); toast("归档了，记录都还在");
  };
  if (i>=0) $("tDel").onclick=()=>{
    if ($("tDel").dataset.arm){ S.tasks.splice(i,1); save(); parentHome(); }
    else { $("tDel").dataset.arm=1; $("tDel").textContent="再点一下确认删除（以前的记录会保留）"; }
  };
}
